[project]
name = "specpol"
version = "0.1.0"
description = "Multispectral polarization imaging: live Stokes preview and filter-by-filter measurement runs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.2",
    "numpy",
    "pillow>=13.0.0",
    "pygobject",
    "streamlit",
    "tifffile",
    "watchdog>=7.1.0",
]

[project.scripts]
specpol = "specpol.cli:main"

[dependency-groups]
dev = ["pytest"]
docs = ["furo", "myst-parser", "sphinx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
